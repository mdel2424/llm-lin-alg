name: Check and publish course to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # Playwright 1.58.2 supports 24.04; avoid ubuntu-latest OS migrations.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install development dependencies
        run: npm ci --ignore-scripts
      - name: Check JavaScript and numerical mechanisms
        run: npm run check && npm test
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Check all chapters, keyboard controls, and responsive layouts
        run: npm run test:browser
      - name: Save screenshots and browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: browser-review
          path: docs/qa/
          retention-days: 14
      - name: Package and verify static files
        run: npm run package
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy checked artifact
        id: deployment
        uses: actions/deploy-pages@v4
